# Catálogo único de versiones del proyecto Android (E0.7). Toda dependencia nueva se agrega aquí.
# Las versiones se fijaron y verificaron en E0.7 (ver docs/arquitectura.md §13). Regla: Kotlin 2.2.10
# lee metadatos hasta 2.3, así que no se suben librerías compiladas con Kotlin 2.4 o superior.
[versions]
agp = "9.4.1"
kotlin = "2.2.10"
composeBom = "2026.02.01"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
coreSplashscreen = "1.2.0"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
koin = "4.1.1"
navigation = "2.9.8"
retrofit = "3.0.0"
okhttp = "5.5.1"
datastore = "1.2.1"
coil = "3.4.0"
credentials = "1.6.0"
googleid = "1.1.1"
firebaseBom = "34.19.0"
billing = "8.3.0"
zxing = "3.5.4"
codeScanner = "16.1.0"
googleServices = "4.5.0"
# Gradle Play Publisher (E10.2): 4.x es la serie compatible con AGP 9 (verificado con AGP 9.4.1).
playPublisher = "4.1.1"
# Pruebas
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
androidxTestCore = "1.7.0"
robolectric = "4.16.1"
roborazzi = "1.77.0"
turbine = "1.2.1"
# Estilo
spotless = "8.10.4"
ktlint = "1.7.1"

[libraries]
# Build incluido ../contract (E0.2); la versión la resuelve la sustitución de includeBuild.
parcheu-contract = { group = "me.santiagoreina.parcheu", name = "contract" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

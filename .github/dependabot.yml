# Mantiene al día las acciones fijadas a SHA (C-M3): Dependabot propone el SHA nuevo y conserva
# el comentario `# vX.Y.Z`. Estos PR tocan .github/workflows/, y cualquier PR que lo haga necesita la
# etiqueta `gobernanza` (revision-agente/major-gate) y lo revisa una persona (docs/PLAN.md §5).
# Dependabot lee esta configuración de la rama por defecto: no actúa hasta que llegue a `main`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "Actualiza"
    labels:
      - dependencies
      - gobernanza

name: firebase-deploy

# E0.8. Reglas, índices y Hosting de Firebase.
#  - PR que toca firebase/**: prueba las reglas en el emulador (rules-ci; E0.6 puede absorber este job).
#  - push a dev que toca firebase/**: despliega a parcheu-dev solo si la variable GCP_DEV_ENABLED es 'true' (ADR-0033);
#    si no, avisa con un ::notice y lo omite.
#  - tag v*: despliega a prod con la aprobación del environment `production`.
# Autenticación con WIF (sa-deployer): sin llaves JSON.
on:
  pull_request:
    paths:
      - "firebase/**"
      - ".github/workflows/firebase-deploy.yml"
  push:
    branches: [dev]
    paths:
      - "firebase/**"
      - ".github/workflows/firebase-deploy.yml"
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rules-test:
    name: rules-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Pruebas de reglas en el emulador de Firestore
        run: npm test

  # Sin GCP_DEV_ENABLED (ADR-0033) no hay WIF ni parcheu-dev: el despliegue se omite con un aviso en vez de fallar.
  deploy-dev-omitido:
    name: deploy-dev-omitido
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.GCP_DEV_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::deploy-dev omitido: la variable de repositorio GCP_DEV_ENABLED no es 'true' (backend de dev en el homeserver, ADR-0033). Defínela cuando exista parcheu-dev con WIF."

  deploy-dev:
    name: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.GCP_DEV_ENABLED == 'true'
    needs: rules-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT: parcheu-dev
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_DEV }}
      - name: Despliega reglas, índices y Hosting a dev
        run: npx firebase deploy --only firestore:rules,firestore:indexes,hosting --project "$FIREBASE_PROJECT" --non-interactive
      - name: Humo del Hosting
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://${FIREBASE_PROJECT}.web.app/")
          echo "Hosting respondió $code"
          test "$code" = "200"

  deploy-prod:
    name: deploy-prod
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: rules-test
    runs-on: ubuntu-latest
    # El environment `production` exige la aprobación del usuario.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      # Mismo proyecto que deploy-prod (variable GCP_PROJECT_PROD si parcheu-prod terminó con sufijo).
      FIREBASE_PROJECT: ${{ vars.GCP_PROJECT_PROD || 'parcheu-prod' }}
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Misma regla que deploy-prod: solo un tag vX.Y.Z que apunte a un commit de main despliega reglas y Hosting
      # a prod. WIF solo exige environment `production` y un tag `v*` (env_ref), no que el tag esté en main.
      - name: Exige un tag vX.Y.Z sobre main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag inválido: $TAG"; exit 1; }
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::El tag $TAG no apunta a un commit de main."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_PROD }}
      # C-B9: prod usa firebase.prod.json (rewrite /v1/** a Cloud Run y predeploy que renderiza el assetlinks de
      # prod con la huella de Play App Signing). Falla cerrado si falta la variable PLAY_APP_SIGNING_SHA256.
      - name: Exige la huella de Play App Signing (variable PLAY_APP_SIGNING_SHA256)
        env:
          PLAY_APP_SIGNING_SHA256: ${{ vars.PLAY_APP_SIGNING_SHA256 }}
        run: |
          if [[ -z "$PLAY_APP_SIGNING_SHA256" ]]; then
            echo "::error::Falta la variable PLAY_APP_SIGNING_SHA256 (huella SHA-256 de Play App Signing, docs/pendientes-humanos.md). Sin ella el assetlinks de prod saldría sin la huella."
            exit 1
          fi
      - name: Despliega reglas, índices y Hosting a prod
        env:
          PLAY_APP_SIGNING_SHA256: ${{ vars.PLAY_APP_SIGNING_SHA256 }}
        run: npx firebase deploy --config firebase.prod.json --only firestore:rules,firestore:indexes,hosting --project "$FIREBASE_PROJECT" --non-interactive
      - name: Humo del Hosting (páginas legales y assetlinks de prod)
        env:
          HUELLA: ${{ vars.PLAY_APP_SIGNING_SHA256 }}
        run: |
          base="https://${FIREBASE_PROJECT}.web.app"
          for p in "" privacidad terminos borrar-cuenta; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/$p")
            echo "/$p respondió $code"
            test "$code" = "200"
          done
          # El assetlinks servido debe ser el de prod (paquete sin .dev) con la huella de Play App Signing.
          links="$(curl -fsS "$base/.well-known/assetlinks.json")"
          jq -e '.[0].target.package_name == "me.santiagoreina.parcheu"' <<<"$links" >/dev/null
          jq -e --arg h "${HUELLA^^}" '.[0].target.sha256_cert_fingerprints | index($h) != null' <<<"$links" >/dev/null

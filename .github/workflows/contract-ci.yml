name: contract-ci

# E0.6. Tests del contrato compartido (DTOs, ejemplos JSON, cobertura). Un cambio en contract/
# también dispara android-ci y backend-ci, que lo consumen con includeBuild.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cambios:
    name: contract-cambios
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      existe: ${{ steps.existe.outputs.existe }}
      contract: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filtro.outputs.contract }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filtro
        with:
          filters: |
            contract:
              - 'contract/**'
              - '.github/workflows/contract-ci.yml'
      - name: Comprueba que existe contract/
        id: existe
        run: |
          if [[ -f "contract/gradlew" ]]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No existe contract/gradlew en esta rama (solo un README o nada): se omite la verificación hasta que lleguen los cimientos."
          fi

  verificar:
    name: contract-verificar
    needs: cambios
    if: needs.cambios.outputs.contract == 'true' && needs.cambios.outputs.existe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Build y tests del contrato
        working-directory: contract
        run: ./gradlew --stacktrace build

  contract-ci:
    name: contract-ci
    needs: [cambios, verificar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resultado
        env:
          CAMBIOS: ${{ needs.cambios.result }}
          VERIFICAR: ${{ needs.verificar.result }}
        run: |
          echo "cambios=$CAMBIOS verificar=$VERIFICAR"
          [[ "$CAMBIOS" == success ]] || exit 1
          [[ "$VERIFICAR" == success || "$VERIFICAR" == skipped ]] || exit 1

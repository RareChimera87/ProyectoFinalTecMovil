name: android-ci

# E0.6. ktlint (Spotless), lint de Android, tests JVM (Robolectric) y verificación de Roborazzi.
# Corre en todo PR para que el check `android-ci` siempre reporte (es obligatorio en dev); el
# trabajo pesado solo corre si el PR toca android/ o contract/ (filtro por ruta en `cambios`).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cambios:
    name: android-cambios
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filtro.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            android:
              - 'android/**'
              - 'contract/**'
              - '.github/workflows/android-ci.yml'

  verificar:
    name: android-verificar
    needs: cambios
    if: needs.cambios.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 para el contrato y el daemon; 17 es el toolchain de la app (queda como JAVA_HOME).
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@v4
      - name: google-services.json de dev (secreto, nunca versionado)
        env:
          GOOGLE_SERVICES_JSON_DEV: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON_DEV" ]]; then
            mkdir -p android/app/src/dev
            base64 -d <<<"$GOOGLE_SERVICES_JSON_DEV" > android/app/src/dev/google-services.json
          else
            echo "::notice::Sin GOOGLE_SERVICES_JSON_DEV: el build sigue sin Firebase (missingGoogleServicesStrategy=WARN)."
          fi
      - name: ktlint, lint, tests JVM, Roborazzi y permiso BILLING de prodRelease (E7.0)
        working-directory: android
        run: >-
          ./gradlew --stacktrace
          spotlessCheck
          :app:lintDevDebug :app:testDevDebugUnitTest
          :app:verifyProdReleaseBillingPermission
          :designsystem:lintDebug :designsystem:testDebugUnitTest
          -Proborazzi.test.verify=true
      - name: Reportes y diferencias de capturas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reportes
          path: |
            android/*/build/reports/
            android/*/build/outputs/roborazzi/
            android/*/build/test-results/
          retention-days: 7

  android-ci:
    name: android-ci
    needs: [cambios, verificar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resultado
        env:
          CAMBIOS: ${{ needs.cambios.result }}
          VERIFICAR: ${{ needs.verificar.result }}
        run: |
          echo "cambios=$CAMBIOS verificar=$VERIFICAR"
          [[ "$CAMBIOS" == success ]] || exit 1
          [[ "$VERIFICAR" == success || "$VERIFICAR" == skipped ]] || exit 1

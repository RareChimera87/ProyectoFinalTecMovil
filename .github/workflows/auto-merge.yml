name: auto-merge

# E0.6 + ADR-0001. Activa el auto-merge (squash) en los PR feature/* y fix/* hacia dev: GitHub
# los mezcla solo cuando pasan los checks obligatorios de la protección de dev (la CI aplicable,
# `revision-agente` y `major-gate`; ver scripts/proteger-ramas.sh). Nunca toca PR hacia main.
#
# Token: AUTO_MERGE_TOKEN (PAT fine-grained del dueño del repo, contents + pull requests: write).
# Con el GITHUB_TOKEN el auto-merge funciona, pero el push a dev que produce NO dispara
# deploy-dev, infra-ci (apply) ni review-counter (regla de GitHub para eventos del GITHUB_TOKEN).
#
# Salvaguarda: `gh pr merge --auto` mezcla AL INSTANTE si la rama no exige checks. Por eso solo
# se activa si la protección de dev exige `revision-agente` y `major-gate`; si no, no hace nada
# (así se mezcló sin revisión el PR #11 el 22 oct, antes de configurar la protección).
#
# Corre con `pull_request_target`: el YAML es el de la rama base (dev), así que un PR no puede quitarse
# la salvaguarda editando este archivo. Nunca ejecuta código del PR: solo llama a `gh`.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: auto-merge
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/'))
    runs-on: ubuntu-latest
    steps:
      - name: Activa el auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          CON_PAT: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          requeridos="$(gh api "repos/$GITHUB_REPOSITORY/branches/dev" \
            --jq '[.protection.required_status_checks.contexts[]?] | join(",")' 2>/dev/null || true)"
          for check in revision-agente major-gate; do
            if [[ ",$requeridos," != *",$check,"* ]]; then
              echo "::warning::La protección de dev no exige '$check' (exige: '${requeridos:-nada}'): no se activa el auto-merge. Ver docs/pendientes-humanos.md (E0.6, paso 5)."
              exit 0
            fi
          done
          # Archivos que definen la propia CI y la revisión: un PR que los toque podría dejar en verde
          # sus checks. Esos PR no se mezclan solos: se marcan `major` (major-gate pide la aprobación de
          # otro revisor) y los mezcla una persona. Lista espejo: scripts/test/workflows.test.py.
          sensibles='^(\.github/workflows/|\.github/CODEOWNERS$|scripts/revision-agente/|scripts/review-counter\.py$|scripts/proteger-ramas\.sh$)'
          if gh pr diff "$PR" -R "$GITHUB_REPOSITORY" --name-only | grep -Eq "$sensibles"; then
            echo "::warning::El PR toca la CI o la revisión automática: no se activa el auto-merge; requiere aprobación humana."
            gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label major || true
            exit 0
          fi
          if [[ "$CON_PAT" != true ]]; then
            echo "::warning::Sin AUTO_MERGE_TOKEN: el merge no disparará deploy-dev ni review-counter (correrlos con workflow_dispatch)."
          fi
          gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --auto --squash

name: infra-ci

# Verificación de Terraform (E0.5). E0.6 lo amplía (comentario del plan en el PR,
# apply de dev al mezclar). Autenticación con WIF: sin llaves JSON.
on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/check-plan.sh"
      - "scripts/check-iam.sh"
      - "scripts/test/check-plan.test.sh"
      - "scripts/test/fixtures/**"
      - ".github/workflows/infra-ci.yml"
  push:
    branches: [dev]
    paths:
      - "infra/**"

permissions:
  contents: read

env:
  TF_VERSION: "1.15.9"
  TF_IN_AUTOMATION: "true"

jobs:
  static:
    name: infra-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: terraform validate
        run: |
          for d in bootstrap envs/dev envs/prod; do
            echo "::group::$d"
            terraform -chdir=infra/terraform/$d init -backend=false -input=false
            terraform -chdir=infra/terraform/$d validate
            echo "::endgroup::"
          done
      - name: Pruebas de check-plan y check-iam
        run: scripts/test/check-plan.test.sh

  plan-dev:
    name: infra-plan-dev
    runs-on: ubuntu-latest
    needs: static
    permissions:
      contents: read
      id-token: write
    env:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      TF_VAR_billing_account: ${{ secrets.BILLING_ACCOUNT_ID }}
    steps:
      - name: Requiere los secretos del bootstrap
        if: env.WIF_PROVIDER == ''
        run: |
          echo "::error::Falta el secreto WIF_PROVIDER: aplica infra/terraform/bootstrap en dev (ver infra/terraform/README.md)."
          exit 1
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.TF_SERVICE_ACCOUNT_DEV }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform plan (dev)
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -input=false
          terraform plan -input=false -lock-timeout=120s -out=plan.tfplan
          terraform show -json plan.tfplan > plan.json
      - name: check-plan y check-iam
        run: |
          scripts/check-plan.sh infra/terraform/envs/dev/plan.json
          scripts/check-iam.sh infra/terraform/envs/dev/plan.json

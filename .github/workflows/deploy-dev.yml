name: deploy-dev

# E0.6. Push a dev que toca el backend o el contrato: Jib -> Artifact Registry -> job migrate
# -> API en Cloud Run de parcheu-dev -> humo de /v1/health con el SHA (flujo en _desplegar-api.yml).
# Desde ADR-0033 el backend de pruebas vive en el homeserver (deploy/homelab): este despliegue solo corre si la
# variable de repositorio GCP_DEV_ENABLED es 'true' (cuando exista la infraestructura de parcheu-dev).
# workflow_dispatch sirve para redesplegar a mano (p. ej. si el merge lo hizo el GITHUB_TOKEN).
on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "contract/**"
      - ".github/workflows/deploy-dev.yml"
      - ".github/workflows/_desplegar-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  api:
    name: deploy-dev
    if: github.ref == 'refs/heads/dev' && vars.GCP_DEV_ENABLED == 'true'
    uses: ./.github/workflows/_desplegar-api.yml
    with:
      entorno: dev
      proyecto: ${{ vars.GCP_PROJECT_DEV || 'parcheu-dev' }}
    secrets:
      wif_provider: ${{ secrets.WIF_PROVIDER }}
      wif_service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_DEV }}

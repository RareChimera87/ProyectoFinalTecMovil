name: deploy-dev

# E0.6. Push a dev que toca el backend o el contrato: Jib -> Artifact Registry -> job migrate
# -> API en Cloud Run de parcheu-dev -> humo de /v1/health con el SHA (flujo en _desplegar-api.yml).
# Desde ADR-0033 el backend de pruebas vive en el homeserver (deploy/homelab): este despliegue solo corre si la
# variable de repositorio GCP_DEV_ENABLED es 'true' (cuando exista la infraestructura de parcheu-dev).
# workflow_dispatch redespliega a mano (p. ej. si el merge lo hizo el GITHUB_TOKEN), pero tampoco corre sin GCP_DEV_ENABLED.
# E10.6: después del despliegue corre el smoke e2e (backend/src/e2eTest) contra dev con dos usuarios de prueba;
# si falla, el workflow falla. Sin los secretos que necesita se omite con un aviso (mismo patrón que infra-ci).
on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "contract/**"
      - ".github/workflows/deploy-dev.yml"
      - ".github/workflows/_desplegar-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  api:
    name: deploy-dev
    if: github.ref == 'refs/heads/dev' && vars.GCP_DEV_ENABLED == 'true'
    uses: ./.github/workflows/_desplegar-api.yml
    with:
      entorno: dev
      proyecto: ${{ vars.GCP_PROJECT_DEV || 'parcheu-dev' }}
    secrets:
      wif_provider: ${{ secrets.WIF_PROVIDER }}
      wif_service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_DEV }}

  e2e:
    name: smoke-e2e
    needs: api
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    # El smoke dura menos de 5 min (criterio de E10.6); el resto es preparar Gradle y las credenciales.
    timeout-minutes: 20
    concurrency:
      group: smoke-e2e-dev
      cancel-in-progress: false
    env:
      PROYECTO: ${{ vars.GCP_PROJECT_DEV || 'parcheu-dev' }}
      REGION: us-central1
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SA: ${{ secrets.WIF_SERVICE_ACCOUNT_DEV }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
    steps:
      - name: Comprueba los secretos del smoke
        id: guarda
        run: |
          faltan=""
          [[ -z "$WIF_PROVIDER" ]] && faltan="$faltan WIF_PROVIDER"
          [[ -z "$WIF_SA" ]] && faltan="$faltan WIF_SERVICE_ACCOUNT_DEV"
          [[ -z "$GOOGLE_SERVICES_JSON" ]] && faltan="$faltan GOOGLE_SERVICES_JSON_DEV"
          if [[ -n "$faltan" ]]; then
            echo "::notice::Smoke e2e omitido: faltan los secretos$faltan (ver docs/pendientes-humanos.md, sección E10.6)."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.guarda.outputs.listo == 'true'
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        if: steps.guarda.outputs.listo == 'true'
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_DEV }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        if: steps.guarda.outputs.listo == 'true'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.guarda.outputs.listo == 'true'
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        if: steps.guarda.outputs.listo == 'true'
      - name: Datos de dev para el smoke
        if: steps.guarda.outputs.listo == 'true'
        run: |
          url="$(gcloud run services describe api --project "$PROYECTO" --region "$REGION" --format 'value(status.url)')"
          # La clave web de Firebase sale de google-services.json (secreto en base64); solo canjea tokens personalizados.
          api_key="$(base64 -d <<<"$GOOGLE_SERVICES_JSON" | jq -r '.client[0].api_key[0].current_key')"
          if [[ -z "$url" || -z "$api_key" || "$api_key" == "null" ]]; then
            echo "::error::No se pudo resolver la URL de la API o la clave web de Firebase de $PROYECTO."
            exit 1
          fi
          echo "::add-mask::$api_key"
          {
            echo "E2E_BASE_URL=$url"
            echo "E2E_FIREBASE_PROJECT_ID=$PROYECTO"
            echo "E2E_FIREBASE_API_KEY=$api_key"
            # sa-deployer firma los tokens personalizados con IAM signBlob suplantándose a sí misma.
            echo "E2E_SERVICE_ACCOUNT=$WIF_SA"
            echo "E2E_REQUIRED=true"
          } >> "$GITHUB_ENV"
      - name: Smoke e2e
        if: steps.guarda.outputs.listo == 'true'
        working-directory: backend
        run: ./gradlew --stacktrace e2eTest
      - name: Informe del smoke
        if: failure() && steps.guarda.outputs.listo == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-e2e-informe
          path: backend/build/reports/tests/e2eTest
          if-no-files-found: ignore

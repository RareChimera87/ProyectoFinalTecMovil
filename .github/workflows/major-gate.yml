name: major-gate

# Pasa si el PR no lleva la etiqueta `major` o si la última revisión de al menos un
# usuario distinto del autor es una aprobación (PLAN.md §5, equipo.md "Revisores par").
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  major-gate:
    name: major-gate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Evalúa la puerta
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPO/pulls/$PR")"
          if ! jq -e '.labels | map(.name) | index("major")' <<<"$pr" >/dev/null; then
            echo "El PR no es major: la puerta pasa."
            exit 0
          fi
          autor="$(jq -r '.user.login' <<<"$pr")"
          aprobaciones="$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            | jq -s --arg autor "$autor" '
                add | map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"))
                | group_by(.user.login) | map(last)
                | map(select(.state == "APPROVED" and .user.login != $autor)) | length')"
          if (( aprobaciones >= 1 )); then
            echo "PR major con $aprobaciones aprobación(es) de un revisor distinto del autor."
          else
            echo "::error::PR major: falta la aprobación de un revisor par distinto de $autor."
            exit 1
          fi

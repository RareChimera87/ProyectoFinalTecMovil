name: backend-ci

# E0.6. Tests del backend con Testcontainers (Docker sí existe en el runner) y build de la
# imagen con Jib sin daemon (jibBuildTar). Mismo patrón que android-ci: el check
# `backend-ci` siempre reporta y el trabajo solo corre si el PR toca backend/ o contract/.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cambios:
    name: backend-cambios
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      existe: ${{ steps.existe.outputs.existe }}
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filtro.outputs.backend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filtro
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'contract/**'
              - 'firebase/firebase.json'
              - '.github/workflows/backend-ci.yml'
      - name: Comprueba que existe backend/
        id: existe
        run: |
          if [[ -f "backend/gradlew" ]]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No existe backend/gradlew en esta rama (solo un README o nada): se omite la verificación hasta que lleguen los cimientos."
          fi

  verificar:
    name: backend-verificar
    needs: cambios
    if: needs.cambios.outputs.backend == 'true' && needs.cambios.outputs.existe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          # 17 para el contrato; 21 para el backend (queda como JAVA_HOME).
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # E5.1 y E4.2: los espejos del chat y de matchTickets se prueban contra el emulador de Firestore (necesita Java 21,
      # que queda como JAVA_HOME). `emulators:exec` define FIRESTORE_EMULATOR_HOST para Gradle.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - name: Herramientas de Firebase (emulador)
        working-directory: firebase
        run: npm ci
      - name: Tests (con Testcontainers y emulador de Firestore) e imagen Jib
        working-directory: firebase
        run: npx firebase emulators:exec --only firestore --project demo-parcheu "cd ../backend && ./gradlew --stacktrace test jibBuildTar"
      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-reportes
          path: |
            backend/build/reports/
            backend/build/test-results/
          retention-days: 7

  backend-ci:
    name: backend-ci
    needs: [cambios, verificar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resultado
        env:
          CAMBIOS: ${{ needs.cambios.result }}
          VERIFICAR: ${{ needs.verificar.result }}
        run: |
          echo "cambios=$CAMBIOS verificar=$VERIFICAR"
          [[ "$CAMBIOS" == success ]] || exit 1
          [[ "$VERIFICAR" == success || "$VERIFICAR" == skipped ]] || exit 1

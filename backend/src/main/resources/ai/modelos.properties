# Pasarela de IA (E0.9, ADR-0008 y ADR-0010): IDs de modelo y tabla de precios.
#
# Los IDs viven aquí (configuración), nunca en el código. Las variables de entorno AI_PROVIDER,
# AI_MODEL_CHAT, AI_MODEL_JUDGE, AI_MODEL_LITE, AI_DAILY_BUDGET_USD y AI_VERTEX_LOCATION tienen
# prioridad sobre estos valores (Terraform o el despliegue pueden fijarlos por entorno).
#
# Spike del 22-oct-2026 contra Vertex AI en parcheu-dev (detalle en ADR-0008):
# - gemini-3.8-flash y gemini-3.5-flash-lite: GA, responden en la multirregión `us`
#   (aiplatform.us.rep.googleapis.com). No están en us-central1; `us` mantiene el
#   procesamiento en EE. UU. (ADR-0020).
# - claude-sonnet-5-5 y claude-haiku-5-5: publicados en `us` y `global`, pero la cuota del
#   proyecto es 0 (429). Claude queda desactivado hasta que se pida cuota y se confirme que
#   los créditos lo cubren.

provider=gemini
vertex.location=us
# Presupuesto diario por defecto (USD). En prod lo fija AI_DAILY_BUDGET_USD.
budget.daily.usd=3

gemini.model.chat=gemini-3.8-flash
gemini.model.judge=gemini-3.8-flash
gemini.model.lite=gemini-3.5-flash-lite
# Nivel de razonamiento de Gemini 3.x. LOW lo aceptan ambos modelos; MINIMAL no existe en 3.8.
gemini.thinking.level=LOW

claude.model.chat=claude-sonnet-5-5
claude.model.judge=claude-sonnet-5-5
claude.model.lite=claude-haiku-5-5

# Precios en USD por millón de tokens: entrada,salida (la salida incluye el razonamiento).
# Clave: price.<ubicación>.<modelo>[@<vigente desde yyyy-MM-dd>]. Fuente: página de precios
# de Vertex AI consultada el 22-oct-2026, tarifa estándar on-demand, contexto <= 200K.
# `us` es tarifa "non-global" (regional/multirregional); `global` es la del endpoint global.
price.us.gemini-3.8-flash=0.825,4.125
price.us.gemini-3.8-flash@2027-01-01=1.65,8.25
price.global.gemini-3.8-flash=0.75,3.75
price.global.gemini-3.8-flash@2027-01-01=1.50,7.50
price.us.gemini-3.5-flash-lite=0.33,2.75
price.global.gemini-3.5-flash-lite=0.30,2.50
price.us.gemini-3.1-flash-lite=0.275,1.65
price.global.gemini-3.1-flash-lite=0.25,1.50
price.us.claude-haiku-5-5=0.11,0.55
price.global.claude-haiku-5-5=0.10,0.50
price.us.claude-sonnet-5-5=2.20,11.00
price.global.claude-sonnet-5-5=2.00,10.00
price.us.claude-opus-5-5=4.40,22.00
price.global.claude-opus-5-5=4.00,20.00
